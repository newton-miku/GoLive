name: Release Build & Package

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            artifact_name: golive-linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
            archive_ext: tar.gz
          - runs-on: ubuntu-latest
            artifact_name: golive-linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
            archive_ext: tar.gz
          - runs-on: windows-2022
            artifact_name: golive-windows-amd64
            goos: windows
            goarch: amd64
            ext: ".exe"
            archive_ext: zip

    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build Go binary
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          EXT="${{ matrix.ext }}"
          OUTPUT_NAME="golive$EXT"
          echo "Building for GOOS=$GOOS GOARCH=$GOARCH -> $OUTPUT_NAME"
          go build -ldflags="-s -w" -trimpath -o "$OUTPUT_NAME" ./cmd/server

      - name: Prepare release directory
        run: |
          mkdir -p ${{ matrix.artifact_name }}
          cp "golive${{ matrix.ext }}" ${{ matrix.artifact_name }}/golive${{ matrix.ext }}
          cp -r frontend/dist ${{ matrix.artifact_name }}/dist

      - name: Package release (Linux)
        if: matrix.goos == 'linux'
        run: tar -czvf ${{ matrix.artifact_name }}.tar.gz ${{ matrix.artifact_name }}

      - name: Package release (Windows)
        if: matrix.goos == 'windows'
        run: powershell -Command "Compress-Archive -Path '${{ matrix.artifact_name }}/*' -DestinationPath '${{ matrix.artifact_name }}.zip' -Force"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
