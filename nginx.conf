server {
    listen 80;
    server_name your-domain.com;   # 替换为你的域名或服务器 IP

    # WHIP/WHEP 信令的 SDP offer/answer body 可能较大
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 说明：
#
# 1. HTTP 信令（WHIP/WHEP）
#    走 Nginx → Go 服务 127.0.0.1:8080，完全透明。
#
# 2. WebRTC 媒体（UDP 8080）
#    完全绕过 Nginx。服务端通过 api.ipify.org 自动检测出口公网 IP，
#    将其写入 ICE 候选 SDP。客户端拿到 SDP 后直接 UDP 直连该 IP:8080。
#
# 3. 防火墙必须放行 UDP 8080
#    ufw allow 8080/udp
#    或云服务器安全组：入站规则 → 自定义 UDP → 8080
#
# 4. 若使用 Cloudflare
#    DNS 设置中将该域名关掉橙色云（CDN 代理），
#    改为灰色 DNS-only，否则 UDP 媒体流被 Cloudflare 阻断。
#
